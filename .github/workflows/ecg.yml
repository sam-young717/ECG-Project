# This is a basic workflow to help you get started with the Run C/C++test action for a CMake-based project.
name: C/C++test with CMake

on:
  # Triggers the workflow on push or pull request events but only for the master (main) branch.
  push:
    branches: [ feature ]
  pull_request:
    branches: [ feature ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  run-cpptest-make:
    name: Analyze project with C/C++test

    # Specifies required permissions for upload-sarif action
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: write
      pull-requests: write

    # Specifies the type of runner that the job will run on.
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:

    # Checks out your repository under $GITHUB_WORKSPACE, so that your job can access it.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare main reference for C/C++test
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if [ "$(git symbolic-ref --quiet --short HEAD || true)" != main ]; then
          git branch -f main refs/remotes/origin/main
        fi
        git rev-parse --verify refs/heads/main
        test -f /mnt/c/Users/syoung/Documents/Solutions/Linux/2026.1/Standard/cpptest/cpptestcli.properties

    - name: Prepare changed-source compilation database
      run: |
        export CPPTEST_ANALYSIS_BUILD_DIR="$(mktemp -d "$RUNNER_TEMP/ecg-cpptest-build.XXXXXX")"
        cmake -S . -B "$CPPTEST_ANALYSIS_BUILD_DIR" -DCPPTEST_COVERAGE=OFF \
          -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$GITHUB_WORKSPACE/build/_deps/googletest-src"
        python3 - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        changed = set(subprocess.check_output(
            ["git", "diff", "--name-only", "--diff-filter=ACMRT",
             "refs/remotes/origin/main", "HEAD", "--", "src/*.c"],
            text=True,
        ).splitlines())
        if not changed:
            raise SystemExit("No changed C sources to analyze relative to origin/main")

        database = Path(os.environ["CPPTEST_ANALYSIS_BUILD_DIR"]) / "compile_commands.json"
        commands = json.loads(database.read_text())
        selected = []
        selected_files = set()
        for command in commands:
            source = Path(command["file"]).resolve().relative_to(workspace).as_posix()
            if source in changed:
                selected.append(command)
                selected_files.add(source)
        if selected_files != changed:
            raise SystemExit(f"Missing compilation commands for {sorted(changed - selected_files)}")

        output = workspace / "build/cpptest-scope/compile_commands.json"
        output.parent.mkdir(parents=True, exist_ok=True)
        output.write_text(json.dumps(selected, indent=2) + "\n")
        print(f"Analyzing {len(selected)} compilation commands: {sorted(selected_files)}")
        PY

    # Runs code analysis with C/C++test.
    - name: Run C/C++test
      id: run_cpptest
      # Use the 'run-cpptest-action' GitHub action.
      uses: parasoft/run-cpptest-action@2
      # Optional parameters for 'run-cpptest-action'.
      with:
        input: build/cpptest-scope/compile_commands.json
        testConfig: 'builtin://MISRA C 2025'
        additionalParams: >-
          -fail
          -localsettings /mnt/c/Users/syoung/Documents/Solutions/Linux/2026.1/Standard/cpptest/cpptestcli.properties
          -property scontrol.rep1.git.workspace=${{ github.workspace }}
          -property scope.scontrol.files.filter.mode=all

    # Uploads analysis results in the SARIF format, so that they are displayed as GitHub code scanning alerts.
    - name: Upload results (SARIF)
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with: 
        sarif_file: reports/report.sarif

    # Uploads an archive that includes all report files (.xml, .html, .sarif).
    - name: Archive reports
      uses: actions/upload-artifact@v4
      with:
        name: CpptestReports
        path: reports/*.*

    # Runs C/C++test AI Autofix to automatically fix violations and commit the changes to a new branch.
    - name: Run C/C++test AI Autofix
      id: run_cpptest_autofix
      if: always() && steps.run_cpptest.outcome == 'failure'
      env:
        CPPTEST_COMMIT_FIXES: 1
        WORKFLOWS_DIR: ${{ github.workspace }}/.github/workflows
      run: |
        set -euo pipefail

        # Note: this requires "-fail" to be passed to run-cpptest-action,
        # and the "exitCode" output is available since version 2.0.3 of the action.
        exitCode=${{ steps.run_cpptest.outputs.exitCode }}
        if [ "$exitCode" -ge 130 ]; then
          echo "C/C++test exit code does not indicate violations. No autofix needed."
          exit 0
        fi

        # Set-up autofix branch
        DATE=$(date +'%Y%m%d-%H%M%S')
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BRANCH_NAME="autofix/pr-${{ github.event.pull_request.number }}/$DATE"
          ORIGINAL_BRANCH="${{ github.event.pull_request.head.ref }}"
        else
          BRANCH_NAME="autofix/${{ github.ref_name }}/$DATE"
          ORIGINAL_BRANCH="${{ github.ref_name }}"
        fi
        git checkout -b "$BRANCH_NAME"

        ORIGINAL_SHA=$(git rev-parse HEAD)

        # Run AI Agent to fix violations and commit changes
        "$WORKFLOWS_DIR/cpptest-agent-run.sh"

        # Only push and comment if there are new commits
        if [ "$(git rev-parse HEAD)" != "$ORIGINAL_SHA" ]; then
          git push -u origin HEAD
          export GH_TOKEN="${{ github.token }}"
          BRANCH_URL="${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH_NAME"
          PR_URL=$(gh pr create --head "$BRANCH_NAME" --base "$ORIGINAL_BRANCH" --title "Autofix: $BRANCH_NAME" --body "Automated C/C++test AI Autofix changes")
          COMMENT=$(printf 'C/C++test found violations and opened an AI Autofix PR. Please review the changes and merge or cherry-pick as needed.\nBranch: %s\nAutofix PR: %s' "$BRANCH_URL" "$PR_URL")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
          else
            echo "$COMMENT"
          fi
        fi